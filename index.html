<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱 — チームみらい</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8f8f4;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      color: #1a4a3a;
    }

    /* ===== ヘッダー ===== */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #0f9473;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4db897;
      letter-spacing: 0.08em;
    }

    /* ===== ステータスバー ===== */
    .status-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    .stat {
      background: #fff;
      border: 2px solid #a8e8d4;
      border-radius: 12px;
      padding: 8px 18px;
      text-align: center;
      min-width: 80px;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 800;
      color: #4db897;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 900;
      color: #0f9473;
      line-height: 1.2;
    }

    /* ===== メッセージ ===== */
    #message {
      background: #fff;
      border: 2px solid #a8e8d4;
      border-radius: 12px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f9473;
      margin-bottom: 18px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background 0.25s, border-color 0.25s, color 0.25s;
      max-width: 500px;
      width: 100%;
    }

    #message.matched {
      background: #d4f5e9;
      border-color: #34c98a;
      color: #0a6644;
    }
    #message.miss {
      background: #fff8e6;
      border-color: #f5c842;
      color: #7a5800;
    }
    #message.dummy {
      background: #ffe8e8;
      border-color: #f87171;
      color: #b91c1c;
    }
    #message.clear {
      background: #d4f5e9;
      border-color: #0f9473;
      color: #0a6644;
      font-size: 1.1rem;
    }

    /* ===== ボード ===== */
    #board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }

    @media (max-width: 620px) {
      #board { grid-template-columns: repeat(5, 1fr); gap: 8px; }
    }
    @media (max-width: 420px) {
      #board { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      h1 { font-size: 1.5rem; }
    }

    /* ===== カード ===== */
    .card {
      aspect-ratio: 3/4;
      cursor: pointer;
      perspective: 700px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 12px;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-back,
    .card-front {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 裏面 */
    .card-back {
      background: linear-gradient(145deg, #0f9473, #34c98a);
      box-shadow: 0 3px 10px rgba(15, 148, 115, 0.3);
      border: 2px solid #0a7a5e;
    }

    .card-back-pattern {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-pattern::after {
      content: 'みらい';
      font-size: 0.75rem;
      font-weight: 900;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
      transform: rotate(-20deg);
    }

    .card:hover:not(.flipped):not(.matched) .card-back {
      box-shadow: 0 6px 18px rgba(15, 148, 115, 0.45);
      filter: brightness(1.06);
    }

    /* 表面 */
    .card-front {
      transform: rotateY(180deg);
      background: #fff;
      border: 2px solid #a8e8d4;
      box-shadow: 0 2px 8px rgba(15, 148, 115, 0.12);
      flex-direction: column;
      padding: 8px 5px;
      text-align: center;
    }

    .card-front .name {
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f6b54;
      line-height: 1.4;
      word-break: keep-all;
    }

    .card-front .block {
      font-size: 0.58rem;
      font-weight: 700;
      color: #4db897;
      margin-top: 4px;
      line-height: 1.3;
    }

    /* ダミー表面 */
    .card-front.is-dummy {
      background: #fff5f5;
      border-color: #fca5a5;
    }

    .card-front.is-dummy .name {
      color: #b91c1c;
    }

    .card-front.is-dummy .block {
      color: #f87171;
    }

    /* マッチ済み */
    .card.matched .card-front {
      background: #d4f5e9;
      border-color: #34c98a;
      opacity: 0.7;
    }

    .card.matched .card-front .name {
      color: #0a6644;
    }

    /* ===== ボタン ===== */
    .btn-row {
      margin-top: 22px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      background: #0f9473;
      border: none;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 11px 30px;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 14px rgba(15, 148, 115, 0.35);
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
    }

    .btn:hover {
      background: #0c7d62;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(15, 148, 115, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(15, 148, 115, 0.3);
    }

    .btn.secondary {
      background: #fff;
      color: #0f9473;
      border: 2px solid #a8e8d4;
      box-shadow: none;
    }

    .btn.secondary:hover {
      background: #e8f8f4;
      border-color: #0f9473;
    }

    /* ===== クリアオーバーレイ ===== */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(232, 248, 244, 0.8);
      backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #overlay.show { display: flex; }

    .overlay-box {
      background: #fff;
      border: 3px solid #34c98a;
      border-radius: 24px;
      padding: 36px 44px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(15, 148, 115, 0.2);
      max-width: 340px;
      width: 90%;
    }

    .overlay-box h2 {
      font-size: 2rem;
      font-weight: 900;
      color: #0f9473;
      margin-bottom: 8px;
    }

    .overlay-box .score-big {
      font-size: 3rem;
      font-weight: 900;
      color: #0f9473;
      margin: 12px 0 4px;
      line-height: 1;
    }

    .overlay-box .score-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4db897;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .overlay-box .detail {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a4a3a;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>チームみらい 神経衰弱</h1>
    <div class="tagline">同じ名前のカードを見つけよう！ダミーに注意⚠️</div>
  </header>

  <div class="status-bar">
    <div class="stat">
      <div class="stat-label">⏱ 時間</div>
      <div class="stat-value" id="timerDisplay">0:00</div>
    </div>
    <div class="stat">
      <div class="stat-label">🔄 手数</div>
      <div class="stat-value" id="turnsDisplay">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">✅ ペア</div>
      <div class="stat-value" id="pairsDisplay">0/12</div>
    </div>
    <div class="stat">
      <div class="stat-label">⚠️ ダミー</div>
      <div class="stat-value" id="dummyDisplay">0/3</div>
    </div>
  </div>

  <div id="message">カードをめくってペアを探してください！</div>

  <div id="board"></div>

  <div class="btn-row">
    <button class="btn secondary" id="restartBtn">もう一度</button>
    <button class="btn" id="closeBtn">ゲームを終了</button>
  </div>

  <!-- クリア画面 -->
  <div id="overlay">
    <div class="overlay-box">
      <h2>クリア！🎉</h2>
      <div class="score-big" id="finalScore">0</div>
      <div class="score-label">SCORE</div>
      <div class="detail" id="finalTurns">手数: —</div>
      <div class="detail" id="finalDummy">ダミー踏み: —</div>
      <div class="detail" id="finalTime">タイム: —</div>
      <div class="btn-row">
        <button class="btn secondary" onclick="initGame()">もう一度</button>
        <button class="btn" id="overlayCloseBtn">終了</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Game Plaza Platform SDK
    // 外部ゲームがプラットフォームと通信するための共通インターフェース
    // ============================================================

    /**
     * プラットフォーム通信SDK
     * - プラットフォームからのゲーム開始メッセージを受信
     * - プラットフォームにゲーム結果を送信
     * - プラットフォームにゲーム終了を通知
     */
    const GamePlazaSDK = {
      /** 受信したプレイヤー情報 */
      players: [],
      /** ローカルプレイヤー（操作者） */
      localPlayer: null,
      /** ゲームタイプ */
      gameType: null,

      /**
       * 初期化: プラットフォームからの game_start メッセージを待ち受ける
       * @param {function} onGameStart - ゲーム開始時のコールバック
       */
      init(onGameStart) {
        window.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || data.type !== 'game_start') return;

          this.players = data.players || [];
          this.localPlayer = this.players.find(p => p.isLocal) || null;
          this.gameType = data.gameType;

          if (onGameStart) {
            onGameStart({
              gameType: data.gameType,
              players: this.players,
              localPlayer: this.localPlayer,
            });
          }
        });
      },

      /**
       * ゲーム結果を送信してプラットフォームに通知する
       * @param {string|null} winnerId - 勝者のUUID（引き分けの場合はnull）
       * @param {Object} [scores] - スコア情報（任意）
       */
      sendResult(winnerId, scores = {}) {
        window.parent.postMessage({
          type: 'game_result',
          winnerId: winnerId,
          scores: scores,
        }, '*');
      },

      /**
       * ゲームを閉じることをプラットフォームに通知する
       * （結果を送らずに閉じたい場合に使用）
       */
      sendClose() {
        window.parent.postMessage({ type: 'game_close' }, '*');
      },
    };

    // ============================================================
    // ゲームロジック（ここを書き換えてゲームを実装する）
    // ============================================================

    // ===== データ =====
    const MEMBERS = [
      { id: 'anno',        name: '安野貴博',      block: '参院議員・党首' },
      { id: 'hayashi',     name: '林たくみ',      block: '東北' },
      { id: 'mutou',       name: '武藤かず子',    block: '北関東' },
      { id: 'kawai',       name: '河合みちお',    block: '南関東' },
      { id: 'yamada',      name: '山田えり',      block: '南関東' },
      { id: 'kobayashi',   name: '小林しゅうへい', block: '南関東' },
      { id: 'takayama',    name: '高山さとし',    block: '東京' },
      { id: 'mineshima',   name: 'みねしま侑也',  block: '東京' },
      { id: 'usami',       name: 'うさみ登',      block: '東京' },
      { id: 'tsuchibashi', name: '土橋あきひろ',  block: '東京' },
      { id: 'suda',        name: '須田えいたろう', block: '東海' },
      { id: 'furukawa',    name: '古川あおい',    block: '九州' },
    ];

    // ダミー（ペアなし、各1枚のみ）
    const DUMMIES = [
      { id: 'takaichi', name: '高市早苗',   block: '自民党総裁' },
      { id: 'tamaki',   name: '玉木雄一郎', block: '国民民主党' },
      { id: 'fujita',   name: '藤田文武',   block: '日本維新の会' },
    ];

    // ===== 状態 =====
    let cards = [];
    let flipped = [];
    let turns = 0;
    let pairs = 0;
    let dummyHits = 0;
    let locked = false;
    let timerInterval = null;
    let seconds = 0;
    let timerStarted = false;

    // ===== シャッフル =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ===== タイマー =====
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        document.getElementById('timerDisplay').textContent =
          `${m}:${s.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    // ===== 初期化 =====
    function initGame() {
      document.getElementById('overlay').classList.remove('show');
      turns = 0;
      pairs = 0;
      dummyHits = 0;
      seconds = 0;
      timerStarted = false;
      flipped = [];
      locked = false;
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').textContent = '0:00';
      updateStats();
      setMessage('カードをめくってペアを探してください！', '');

      // 各議員を2枚ずつ生成
      const deck = [];
      MEMBERS.forEach(m => {
        deck.push({ uid: `${m.id}_0`, pairId: m.id, name: m.name, block: m.block, dummy: false, flipped: false, matched: false });
        deck.push({ uid: `${m.id}_1`, pairId: m.id, name: m.name, block: m.block, dummy: false, flipped: false, matched: false });
      });

      // ダミーは各1枚のみ
      DUMMIES.forEach(d => {
        deck.push({ uid: `dummy_${d.id}`, pairId: null, name: d.name, block: d.block, dummy: true, flipped: false, matched: false });
      });

      cards = shuffle(deck);
      renderBoard();
    }

    // ===== ボード描画 =====
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      cards.forEach((card, idx) => {
        const el = document.createElement('div');
        el.className = 'card' +
          (card.flipped ? ' flipped' : '') +
          (card.matched ? ' matched' : '');
        el.dataset.idx = idx;

        const inner = document.createElement('div');
        inner.className = 'card-inner';

        // 裏面
        const back = document.createElement('div');
        back.className = 'card-back';
        const backPattern = document.createElement('div');
        backPattern.className = 'card-back-pattern';
        back.appendChild(backPattern);

        // 表面
        const front = document.createElement('div');
        front.className = 'card-front' + (card.dummy ? ' is-dummy' : '');

        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = card.name;

        const blockEl = document.createElement('div');
        blockEl.className = 'block';
        blockEl.textContent = card.block;

        front.appendChild(nameEl);
        front.appendChild(blockEl);
        inner.appendChild(back);
        inner.appendChild(front);
        el.appendChild(inner);

        el.addEventListener('click', () => onCardClick(idx));
        board.appendChild(el);
      });
    }

    // ===== カードクリック =====
    function onCardClick(idx) {
      if (locked) return;
      const card = cards[idx];
      if (card.flipped || card.matched) return;
      if (flipped.length >= 2) return;

      // 最初のクリックでタイマースタート
      if (!timerStarted) {
        timerStarted = true;
        startTimer();
      }

      card.flipped = true;
      document.querySelectorAll('.card')[idx].classList.add('flipped');
      flipped.push(idx);

      if (flipped.length === 2) {
        turns++;
        updateStats();
        locked = true;
        setTimeout(checkPair, 900);
      }
    }

    // ===== ペア判定 =====
    function checkPair() {
      const [i1, i2] = flipped;
      const c1 = cards[i1];
      const c2 = cards[i2];
      const cardEls = document.querySelectorAll('.card');

      // どちらかダミー
      if (c1.dummy || c2.dummy) {
        dummyHits++;
        const dummyName = c1.dummy ? c1.name : c2.name;
        setMessage(`🚨 ダミー！「${dummyName}」はチームみらいじゃないよ！`, 'dummy');
        setTimeout(() => {
          c1.flipped = false;
          c2.flipped = false;
          cardEls[i1].classList.remove('flipped');
          cardEls[i2].classList.remove('flipped');
          flipped = [];
          locked = false;
          updateStats();
        }, 1100);
        return;
      }

      // ペア成立
      if (c1.pairId === c2.pairId) {
        c1.matched = true;
        c2.matched = true;
        cardEls[i1].classList.add('matched');
        cardEls[i2].classList.add('matched');
        pairs++;
        flipped = [];
        locked = false;
        updateStats();
        setMessage(`✅ ペア成立！「${c1.name}」`, 'matched');

        if (pairs === MEMBERS.length) {
          stopTimer();
          setTimeout(showClear, 500);
        }
        return;
      }

      // 不一致
      setMessage('違います…もう一度！', 'miss');
      setTimeout(() => {
        c1.flipped = false;
        c2.flipped = false;
        cardEls[i1].classList.remove('flipped');
        cardEls[i2].classList.remove('flipped');
        flipped = [];
        locked = false;
      }, 800);
    }

    // ===== クリア =====
    function showClear() {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      const timeStr = `${m}:${s.toString().padStart(2, '0')}`;
      const score = Math.max(0, 1000 - turns * 20 - dummyHits * 50 - seconds * 2);

      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalTurns').textContent = `手数: ${turns} 回`;
      document.getElementById('finalDummy').textContent = `ダミー踏み: ${dummyHits} 回`;
      document.getElementById('finalTime').textContent = `タイム: ${timeStr}`;
      document.getElementById('overlay').classList.add('show');
      setMessage('🎉 全ペアを見つけました！', 'clear');

      // プラットフォームにスコアを送信
      // scores は { [uuid]: number } 形式で渡す（READMEの仕様に従う）
      const winnerId = GamePlazaSDK.localPlayer?.uuid || null;
      const scores = winnerId ? { [winnerId]: score } : {};
      GamePlazaSDK.sendResult(winnerId, scores);
    }

    // ===== UI更新 =====
    function updateStats() {
      document.getElementById('turnsDisplay').textContent = turns;
      document.getElementById('pairsDisplay').textContent = `${pairs}/12`;
      document.getElementById('dummyDisplay').textContent = `${dummyHits}/3`;
    }

    function setMessage(text, cls) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = cls || '';
    }

    // ===== ボタン =====
    document.getElementById('restartBtn').addEventListener('click', initGame);

    document.getElementById('closeBtn').addEventListener('click', () => {
      GamePlazaSDK.sendClose();
    });

    document.getElementById('overlayCloseBtn').addEventListener('click', () => {
      GamePlazaSDK.sendClose();
    });

    // ===== SDK初期化 =====
    GamePlazaSDK.init(({ players, localPlayer }) => {
      // プラットフォームからゲーム開始通知を受け取ったらゲームを開始
      initGame();
    });

    // ローカル確認用：プラットフォームなしでも即スタート
    initGame();
  </script>
</body>
</html>
