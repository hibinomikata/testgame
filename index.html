<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カジノ ルーレット</title>
  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a2e1a;
      background-image:
        radial-gradient(ellipse at top, #0d4a29 0%, #0a2e1a 60%);
      color: #f0e6c8;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 0.15em;
      color: #f5d060;
      text-shadow: 0 0 18px #f5d06088;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #a0c8a0;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    /* ===== メインレイアウト ===== */
    .game-wrapper {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    /* ===== ホイールエリア ===== */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
    }

    #wheelCanvas {
      border-radius: 50%;
      box-shadow:
        0 0 0 6px #8b6914,
        0 0 0 10px #f5d060,
        0 0 0 14px #8b6914,
        0 0 40px #00000088;
    }

    /* ポインター（矢印） */
    .pointer {
      position: absolute;
      top: 50%;
      right: -22px;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
      border-right: 36px solid #f5d060;
      filter: drop-shadow(0 0 6px #f5d060aa);
      z-index: 10;
    }

    /* ===== スピンボタン ===== */
    #spinBtn {
      background: linear-gradient(135deg, #c8960c, #f5d060, #c8960c);
      border: none;
      border-radius: 50px;
      color: #1a0a00;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      padding: 14px 48px;
      box-shadow: 0 4px 16px #00000066, inset 0 1px 0 #fff8;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #spinBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px #00000088, inset 0 1px 0 #fff8;
    }

    #spinBtn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 8px #00000066;
    }

    #spinBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== 結果表示 ===== */
    .result-display {
      background: #000a;
      border: 2px solid #f5d06055;
      border-radius: 12px;
      padding: 12px 24px;
      text-align: center;
      min-width: 200px;
    }

    .result-display .label {
      font-size: 0.75rem;
      color: #a0c8a0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .result-display .number {
      font-size: 3rem;
      font-weight: bold;
      line-height: 1;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-display .result-text {
      font-size: 0.95rem;
      min-height: 22px;
      color: #f5d060;
    }

    /* ===== ベットエリア ===== */
    .bet-section {
      flex: 1;
      min-width: 300px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 残高 */
    .balance-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #000a;
      border: 1px solid #f5d06044;
      border-radius: 10px;
      padding: 12px 20px;
    }

    .balance-bar .label {
      font-size: 0.8rem;
      color: #a0c8a0;
      letter-spacing: 0.1em;
    }

    .balance-bar .amount {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f5d060;
    }

    /* ベット選択パネル */
    .bet-panel {
      background: #00180a;
      border: 1px solid #2a5a2a;
      border-radius: 12px;
      padding: 16px;
    }

    .bet-panel h3 {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #a0c8a0;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    /* チップ選択 */
    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .chip {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 3px dashed;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .chip:hover { transform: scale(1.1); }

    .chip.selected {
      box-shadow: 0 0 0 3px #fff, 0 0 12px #fff8;
      transform: scale(1.15);
    }

    .chip[data-value="5"]  { background: #1a6b1a; border-color: #4dff4d; color: #4dff4d; }
    .chip[data-value="10"] { background: #1a1a6b; border-color: #4d4dff; color: #4d4dff; }
    .chip[data-value="25"] { background: #6b1a1a; border-color: #ff4d4d; color: #ff4d4d; }
    .chip[data-value="50"] { background: #6b5a1a; border-color: #ffd04d; color: #ffd04d; }
    .chip[data-value="100"]{ background: #4a1a6b; border-color: #cc4dff; color: #cc4dff; font-size: 0.75rem; }

    /* ベットグリッド */
    .bet-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bet-type-row {
      display: grid;
      gap: 6px;
    }

    .bet-type-row.numbers-row { grid-template-columns: repeat(6, 1fr); }
    .bet-type-row.outside-row { grid-template-columns: repeat(3, 1fr); }
    .bet-type-row.color-row   { grid-template-columns: repeat(2, 1fr); }

    .bet-btn {
      background: #0d3a1a;
      border: 1px solid #2a6a2a;
      border-radius: 6px;
      color: #e8f8e8;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      padding: 8px 4px;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
      position: relative;
      min-height: 40px;
    }

    .bet-btn:hover {
      background: #1a5a2a;
      transform: scale(1.03);
    }

    .bet-btn.active {
      border-color: #f5d060;
      box-shadow: inset 0 0 8px #f5d06044, 0 0 8px #f5d06044;
    }

    .bet-btn.red-btn  { background: #5a0d0d; border-color: #cc3333; }
    .bet-btn.red-btn:hover  { background: #7a1a1a; }
    .bet-btn.black-btn { background: #111; border-color: #555; }
    .bet-btn.black-btn:hover { background: #222; }
    .bet-btn.zero-btn  { background: #0d3a1a; border-color: #4daa4d; color: #4daa4d; }

    /* ベット額バッジ */
    .bet-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #f5d060;
      color: #1a0a00;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.65rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    /* ===== 現在のベット一覧 ===== */
    .current-bets {
      background: #000a;
      border: 1px solid #2a5a2a;
      border-radius: 10px;
      padding: 12px 16px;
    }

    .current-bets h3 {
      font-size: 0.8rem;
      color: #a0c8a0;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .bets-list {
      font-size: 0.85rem;
      max-height: 100px;
      overflow-y: auto;
      color: #c8e8c8;
    }

    .bets-list:empty::before {
      content: 'ベットなし';
      color: #5a8a5a;
      font-style: italic;
    }

    .bet-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid #1a4a1a;
    }

    .bets-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #f5d060;
    }

    /* クリアボタン */
    #clearBtn {
      background: transparent;
      border: 1px solid #aa3333;
      border-radius: 6px;
      color: #ff6666;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px 14px;
      transition: background 0.15s;
    }

    #clearBtn:hover { background: #aa333322; }

    /* ===== メッセージ ===== */
    .message-box {
      background: #000c;
      border: 2px solid #f5d06055;
      border-radius: 10px;
      padding: 14px 20px;
      text-align: center;
      font-size: 1rem;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5d060;
    }

    .message-box.win  { border-color: #4dff4d; color: #4dff4d; }
    .message-box.lose { border-color: #ff4d4d; color: #ff8888; }

    /* ===== レスポンシブ ===== */
    @media (max-width: 600px) {
      .wheel-container { width: 280px; height: 280px; }
      #wheelCanvas { width: 280px; height: 280px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <h1>🎰 ROULETTE</h1>
  <p class="subtitle">EUROPEAN ROULETTE — シングルゼロ</p>

  <div class="game-wrapper">

    <!-- ===== ホイール ===== -->
    <div class="wheel-section">
      <div class="wheel-container">
        <canvas id="wheelCanvas" width="360" height="360"></canvas>
        <div class="pointer"></div>
      </div>

      <div class="result-display">
        <div class="label">結果</div>
        <div class="number" id="resultNumber">—</div>
        <div class="result-text" id="resultText"></div>
      </div>

      <button id="spinBtn">▶ SPIN</button>
    </div>

    <!-- ===== ベットエリア ===== -->
    <div class="bet-section">

      <div class="balance-bar">
        <span class="label">💰 残高</span>
        <span class="amount" id="balanceDisplay">$1,000</span>
      </div>

      <div class="bet-panel">
        <h3>🎲 チップを選んでベット</h3>

        <!-- チップ -->
        <div class="chips">
          <div class="chip" data-value="5">$5</div>
          <div class="chip" data-value="10">$10</div>
          <div class="chip selected" data-value="25">$25</div>
          <div class="chip" data-value="50">$50</div>
          <div class="chip" data-value="100">$100</div>
        </div>

        <!-- ベットグリッド -->
        <div class="bet-grid">

          <!-- 0 -->
          <div class="bet-type-row" style="grid-template-columns: 1fr;">
            <button class="bet-btn zero-btn" data-type="number" data-value="0">0</button>
          </div>

          <!-- 1〜12, 13〜24, 25〜36（ダズン） -->
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="1">1</button>
            <button class="bet-btn" data-type="number" data-value="2">2</button>
            <button class="bet-btn" data-type="number" data-value="3">3</button>
            <button class="bet-btn" data-type="number" data-value="4">4</button>
            <button class="bet-btn" data-type="number" data-value="5">5</button>
            <button class="bet-btn" data-type="number" data-value="6">6</button>
          </div>
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="7">7</button>
            <button class="bet-btn" data-type="number" data-value="8">8</button>
            <button class="bet-btn" data-type="number" data-value="9">9</button>
            <button class="bet-btn" data-type="number" data-value="10">10</button>
            <button class="bet-btn" data-type="number" data-value="11">11</button>
            <button class="bet-btn" data-type="number" data-value="12">12</button>
          </div>
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="13">13</button>
            <button class="bet-btn" data-type="number" data-value="14">14</button>
            <button class="bet-btn" data-type="number" data-value="15">15</button>
            <button class="bet-btn" data-type="number" data-value="16">16</button>
            <button class="bet-btn" data-type="number" data-value="17">17</button>
            <button class="bet-btn" data-type="number" data-value="18">18</button>
          </div>
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="19">19</button>
            <button class="bet-btn" data-type="number" data-value="20">20</button>
            <button class="bet-btn" data-type="number" data-value="21">21</button>
            <button class="bet-btn" data-type="number" data-value="22">22</button>
            <button class="bet-btn" data-type="number" data-value="23">23</button>
            <button class="bet-btn" data-type="number" data-value="24">24</button>
          </div>
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="25">25</button>
            <button class="bet-btn" data-type="number" data-value="26">26</button>
            <button class="bet-btn" data-type="number" data-value="27">27</button>
            <button class="bet-btn" data-type="number" data-value="28">28</button>
            <button class="bet-btn" data-type="number" data-value="29">29</button>
            <button class="bet-btn" data-type="number" data-value="30">30</button>
          </div>
          <div class="bet-type-row numbers-row">
            <button class="bet-btn" data-type="number" data-value="31">31</button>
            <button class="bet-btn" data-type="number" data-value="32">32</button>
            <button class="bet-btn" data-type="number" data-value="33">33</button>
            <button class="bet-btn" data-type="number" data-value="34">34</button>
            <button class="bet-btn" data-type="number" data-value="35">35</button>
            <button class="bet-btn" data-type="number" data-value="36">36</button>
          </div>

          <!-- アウトサイドベット -->
          <div class="bet-type-row outside-row">
            <button class="bet-btn" data-type="dozen" data-value="1st">1st 12</button>
            <button class="bet-btn" data-type="dozen" data-value="2nd">2nd 12</button>
            <button class="bet-btn" data-type="dozen" data-value="3rd">3rd 12</button>
          </div>
          <div class="bet-type-row outside-row">
            <button class="bet-btn" data-type="half" data-value="low">1〜18</button>
            <button class="bet-btn" data-type="even-odd" data-value="even">偶数</button>
            <button class="bet-btn" data-type="even-odd" data-value="odd">奇数</button>
          </div>
          <div class="bet-type-row color-row">
            <button class="bet-btn red-btn" data-type="color" data-value="red">🔴 RED</button>
            <button class="bet-btn black-btn" data-type="color" data-value="black">⚫ BLACK</button>
          </div>
          <div class="bet-type-row outside-row" style="grid-template-columns: 1fr;">
            <button class="bet-btn" data-type="half" data-value="high">19〜36</button>
          </div>
        </div>
      </div>

      <!-- 現在のベット -->
      <div class="current-bets">
        <h3>現在のベット</h3>
        <div class="bets-list" id="betsList"></div>
        <div class="bets-footer">
          <span>合計: <strong id="totalBetDisplay">$0</strong></span>
          <button id="clearBtn">クリア</button>
        </div>
      </div>

      <!-- メッセージ -->
      <div class="message-box" id="messageBox">チップを選んでベットしてください</div>

    </div>
  </div>

  <script>
    // ===== 定数 =====
    const WHEEL_NUMBERS = [
      0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,
      5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26
    ];

    const RED_NUMBERS = new Set([
      1,3,5,7,9,12,14,16,18,21,23,25,27,30,32,34,36
    ]);

    const PAYOUTS = {
      number:   35, // ストレート
      dozen:     2,
      half:      1,
      'even-odd':1,
      color:     1,
    };

    const BET_LABELS = {
      number: n => `番号 ${n}`,
      dozen:  v => ({ '1st':'1st 12', '2nd':'2nd 12', '3rd':'3rd 12' }[v]),
      half:   v => v === 'low' ? '1〜18' : '19〜36',
      'even-odd': v => v === 'even' ? '偶数' : '奇数',
      color:  v => v === 'red' ? '🔴 RED' : '⚫ BLACK',
    };

    // ===== 状態 =====
    let balance    = 1000;
    let bets       = [];        // { type, value, amount }
    let spinning   = false;
    let chipValue  = 25;
    let rotation   = 0;        // 現在のホイール角度（ラジアン）

    // ===== Canvas =====
    const canvas = document.getElementById('wheelCanvas');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const OUTER_R = W / 2 - 4;
    const INNER_R = OUTER_R * 0.28;

    function getColor(num) {
      if (num === 0) return '#1a8a1a';
      return RED_NUMBERS.has(num) ? '#cc2222' : '#111111';
    }

    function drawWheel(angle) {
      ctx.clearRect(0, 0, W, H);
      const total = WHEEL_NUMBERS.length;
      const sliceAngle = (2 * Math.PI) / total;

      // 外枠
      ctx.beginPath();
      ctx.arc(cx, cy, OUTER_R + 3, 0, 2 * Math.PI);
      ctx.fillStyle = '#5a3a00';
      ctx.fill();

      // スライス
      WHEEL_NUMBERS.forEach((num, i) => {
        const start = angle + i * sliceAngle - Math.PI / 2;
        const end   = start + sliceAngle;

        // 扇形
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, OUTER_R, start, end);
        ctx.closePath();
        ctx.fillStyle = getColor(num);
        ctx.fill();
        ctx.strokeStyle = '#8b6914';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 数字
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + sliceAngle / 2);
        ctx.translate(OUTER_R * 0.78, 0);
        ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${W * 0.042}px Georgia`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(num), 0, 0);
        ctx.restore();
      });

      // 中心円（木目調）
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, INNER_R);
      grad.addColorStop(0, '#c8820a');
      grad.addColorStop(1, '#6b3a00');
      ctx.beginPath();
      ctx.arc(cx, cy, INNER_R, 0, 2 * Math.PI);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#f5d060';
      ctx.lineWidth = 3;
      ctx.stroke();

      // 中心ボルト
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#f5d060';
      ctx.fill();
    }

    drawWheel(rotation);

    // ===== スピンアニメーション =====
    function spinWheel(targetIndex) {
      return new Promise(resolve => {
        const total       = WHEEL_NUMBERS.length;
        const sliceAngle  = (2 * Math.PI) / total;
        // ポインターは右（0度）→ ホイール上でその位置の数字が当選
        // 目標角度: targetIndexのスライス中央がポインター（右=0度）に来るように
        const targetAngle = -(targetIndex * sliceAngle + sliceAngle / 2);
        // 追加回転（5〜8周）
        const extraSpins  = (5 + Math.random() * 3) * 2 * Math.PI;
        const fullTarget  = targetAngle + Math.ceil(extraSpins / (2 * Math.PI)) * 2 * Math.PI;

        const startAngle  = rotation;
        const duration    = 4000 + Math.random() * 1500;
        const startTime   = performance.now();

        function easeOut(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function frame(now) {
          const elapsed = now - startTime;
          const t       = Math.min(elapsed / duration, 1);
          const eased   = easeOut(t);
          rotation      = startAngle + (fullTarget - startAngle) * eased;
          drawWheel(rotation);

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            rotation = targetAngle % (2 * Math.PI);
            drawWheel(rotation);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    // ===== 当選判定 =====
    function checkWin(winNum, bet) {
      const { type, value } = bet;
      if (winNum === 0 && type !== 'number') return false;
      switch (type) {
        case 'number':   return parseInt(value) === winNum;
        case 'dozen':
          if (value === '1st') return winNum >= 1  && winNum <= 12;
          if (value === '2nd') return winNum >= 13 && winNum <= 24;
          if (value === '3rd') return winNum >= 25 && winNum <= 36;
          break;
        case 'half':
          if (value === 'low')  return winNum >= 1  && winNum <= 18;
          if (value === 'high') return winNum >= 19 && winNum <= 36;
          break;
        case 'even-odd':
          if (value === 'even') return winNum % 2 === 0;
          if (value === 'odd')  return winNum % 2 === 1;
          break;
        case 'color':
          if (value === 'red')   return RED_NUMBERS.has(winNum);
          if (value === 'black') return !RED_NUMBERS.has(winNum) && winNum !== 0;
          break;
      }
      return false;
    }

    // ===== UI 更新 =====
    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent =
        '$' + balance.toLocaleString();
    }

    function updateBetsList() {
      const list = document.getElementById('betsList');
      list.innerHTML = '';
      let total = 0;
      bets.forEach(b => {
        total += b.amount;
        const item = document.createElement('div');
        item.className = 'bet-item';
        item.innerHTML = `<span>${BET_LABELS[b.type](b.value)}</span><span>$${b.amount}</span>`;
        list.appendChild(item);
      });
      document.getElementById('totalBetDisplay').textContent = '$' + total;
    }

    function setMessage(text, cls = '') {
      const box = document.getElementById('messageBox');
      box.textContent = text;
      box.className = 'message-box ' + cls;
    }

    // ===== チップ選択 =====
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        chipValue = parseInt(chip.dataset.value);
      });
    });

    // ===== ベットボタン =====
    document.querySelectorAll('.bet-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (spinning) return;
        const type  = btn.dataset.type;
        const value = btn.dataset.value;

        if (chipValue > balance) {
          setMessage('残高が足りません！', 'lose');
          return;
        }

        balance -= chipValue;
        updateBalanceDisplay();

        // 同じベットがあれば加算
        const existing = bets.find(b => b.type === type && b.value === value);
        if (existing) {
          existing.amount += chipValue;
        } else {
          bets.push({ type, value, amount: chipValue });
        }

        btn.classList.add('active');
        updateBetsList();
        setMessage(`${BET_LABELS[type](value)} に $${chipValue} をベット！`);
      });
    });

    // ===== クリア =====
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (spinning) return;
      // ベット額を返金
      const total = bets.reduce((s, b) => s + b.amount, 0);
      balance += total;
      bets = [];
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      updateBalanceDisplay();
      updateBetsList();
      setMessage('ベットをクリアしました');
    });

    // ===== スピン =====
    document.getElementById('spinBtn').addEventListener('click', async () => {
      if (spinning) return;
      if (bets.length === 0) {
        setMessage('先にベットしてください！', 'lose');
        return;
      }

      spinning = true;
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('resultNumber').textContent = '…';
      document.getElementById('resultText').textContent   = '';
      setMessage('スピン中…');

      // 当選番号をランダムに決定
      const winIndex = Math.floor(Math.random() * WHEEL_NUMBERS.length);
      const winNum   = WHEEL_NUMBERS[winIndex];

      await spinWheel(winIndex);

      // 色
      const color = winNum === 0 ? 'green' : RED_NUMBERS.has(winNum) ? 'red' : 'black';
      const colorLabel = winNum === 0 ? '🟢 GREEN' : RED_NUMBERS.has(winNum) ? '🔴 RED' : '⚫ BLACK';
      const numEl = document.getElementById('resultNumber');
      numEl.textContent = winNum;
      numEl.style.color = winNum === 0 ? '#4dff4d' : RED_NUMBERS.has(winNum) ? '#ff6666' : '#cccccc';
      document.getElementById('resultText').textContent = colorLabel;

      // 勝敗計算
      let winnings = 0;
      bets.forEach(bet => {
        if (checkWin(winNum, bet)) {
          winnings += bet.amount * (PAYOUTS[bet.type] + 1); // 賭け金返還 + 配当
        }
      });

      balance += winnings;
      updateBalanceDisplay();

      const betTotal = bets.reduce((s, b) => s + b.amount, 0);
      const net      = winnings - betTotal;

      if (winnings > 0) {
        setMessage(`🎉 当選！ +$${winnings}（純利益 $${net >= 0 ? '+' : ''}${net}）`, 'win');
      } else {
        setMessage(`😔 ハズレ… -$${betTotal} でした`, 'lose');
      }

      // 破産チェック
      if (balance <= 0) {
        setTimeout(() => {
          if (confirm('残高がなくなりました。リセットしますか？')) {
            balance = 1000;
            updateBalanceDisplay();
            setMessage('残高を $1,000 にリセットしました');
          }
        }, 500);
      }

      bets = [];
      document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
      updateBetsList();
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    });

    // 初期描画
    updateBalanceDisplay();
    updateBetsList();
  </script>
</body>
</html>
